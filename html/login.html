<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/sign-up-styles.css" />
    <script type="text/javascript" src="../JS/validation.js" defer></script>
  </head>

  <body>
    <div class="wrapper">
      <h1>Welcome back, we missed you.</h1>
      <p id = 'error-message'></p>
      <form id="form">
        <div>
          <label for="email-input">
            <i class="fa-regular fa-envelope"></i>
          </label>
          <input
            type="email"
            name="email"
            id="email-input"
            autocomplete="email"
            placeholder="kairn@email.com"
          />
        </div>
        <div>
          <label for="password-input">
            <i class="fa-solid fa-shield-halved"></i>
          </label>
          <input
            type="password"
            name="password"
            id="password-input"
            autocomplete="email"
            placeholder="Password"
          />
        </div>

        <div>
          <button>Login</button>
        </div>
      </form>
      <p>
        <span class="bold">Don't have an account?</span>
        <a href="sign-up.html">signup</a>
      </p>
    </div>
  </body>
</html>
